<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0F172A;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  }
  svg#clock {
    width: min(94vw, 94vh, 460px);
    height: min(94vw, 94vh, 460px);
    display: block;
  }
</style>
</head>
<body>
  <svg id="clock" viewBox="-145 -145 290 290">
    <g id="layer-base"></g>
    <g id="layer-center"></g>
    <g id="layer-needle"></g>
  </svg>

<script>
  const MY_START = 9;
  const MY_END = 23;
  const HER_START = 7;
  const HER_END = 22;
  const HER_TZ = "Australia/Sydney";

  const svgNS = "http://www.w3.org/2000/svg";
  const baseLayer = document.getElementById("layer-base");
  const centerLayer = document.getElementById("layer-center");
  const needleLayer = document.getElementById("layer-needle");

  function hourToXY(hour, radius) {
    const angleDeg = (hour / 24) * 360 - 90;
    const rad = (angleDeg * Math.PI) / 180;
    return { x: radius * Math.cos(rad), y: radius * Math.sin(rad) };
  }

  function createArc(startHour, endHour, radius, strokeWidth, color, opacity = 1, round = false) {
    let span = endHour - startHour;
    if (span <= 0) span += 24;
    if (span >= 24) span = 23.999;

    const p1 = hourToXY(startHour, radius);
    const p2 = hourToXY(startHour + span, radius);
    const largeArc = span > 12 ? 1 : 0;

    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", `M ${p1.x} ${p1.y} A ${radius} ${radius} 0 ${largeArc} 1 ${p2.x} ${p2.y}`);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", color);
    path.setAttribute("stroke-width", strokeWidth);
    path.setAttribute("stroke-opacity", opacity);
    path.setAttribute("stroke-linecap", round ? "round" : "butt");
    return path;
  }

  function addText(parent, x, y, text, size, color, weight = "400") {
    const t = document.createElementNS(svgNS, "text");
    t.setAttribute("x", x);
    t.setAttribute("y", y);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("dominant-baseline", "central");
    t.setAttribute("font-size", size);
    t.setAttribute("font-weight", weight);
    t.setAttribute("fill", color);
    t.textContent = text;
    parent.appendChild(t);
    return t;
  }

  function getOffsetHours(now, timeZone) {
    const fmt = new Intl.DateTimeFormat("en-GB", {
      timeZone,
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit",
      hour12: false
    });
    const p = Object.fromEntries(
      fmt.formatToParts(now).filter(x => x.type !== "literal").map(x => [x.type, x.value])
    );
    const herUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
    const locUtc = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
    return (herUtc - locUtc) / 3600000;
  }

  function isHourInRange(h, start, end) {
    h = ((h % 24) + 24) % 24;
    start = ((start % 24) + 24) % 24;
    end = ((end % 24) + 24) % 24;
    if (start < end) return h >= start && h < end;
    return h >= start || h < end;
  }

  function render() {
    baseLayer.innerHTML = "";
    centerLayer.innerHTML = "";
    needleLayer.innerHTML = "";

    const now = new Date();
    const offset = getOffsetHours(now, HER_TZ);

    // 1. Anneau extérieur : Ton heure locale (9h-23h)
    baseLayer.appendChild(createArc(0, 24, 102, 14, "rgba(56, 189, 248, 0.16)", 1, false));
    baseLayer.appendChild(createArc(MY_START, MY_END, 102, 14, "#38BDF8", 0.95, true));

    // 2. Anneau intérieur : Heure australienne tournée selon le décalage (7h-22h chez elle)
    const herStartLoc = (((HER_START - offset) % 24) + 24) % 24;
    const herEndLoc = (((HER_END - offset) % 24) + 24) % 24;
    baseLayer.appendChild(createArc(0, 24, 72, 14, "rgba(251, 146, 60, 0.16)", 1, false));
    baseLayer.appendChild(createArc(herStartLoc, herEndLoc, 72, 14, "#FB923C", 0.95, true));

    // 3. Liseré vert entre les deux anneaux sur les créneaux communs
    const step = 0.25;
    for (let t = 0; t < 24; t += step) {
      if (isHourInRange(t, MY_START, MY_END) && isHourInRange(t, herStartLoc, herEndLoc)) {
        baseLayer.appendChild(createArc(t, t + step, 87, 3.5, "#34D399", 0.9, false));
      }
    }

    // 4. Graduation extérieure : Tes heures locales (0 à 23)
    for (let h = 0; h < 24; h++) {
      const isMajor = h % 3 === 0;
      const tickStart = hourToXY(h, 110);
      const tickEnd = hourToXY(h, isMajor ? 114 : 112);

      const tick = document.createElementNS(svgNS, "line");
      tick.setAttribute("x1", tickStart.x);
      tick.setAttribute("y1", tickStart.y);
      tick.setAttribute("x2", tickEnd.x);
      tick.setAttribute("y2", tickEnd.y);
      tick.setAttribute("stroke", isMajor ? "#7DD3FC" : "#334155");
      tick.setAttribute("stroke-width", isMajor ? "1.4" : "0.9");
      baseLayer.appendChild(tick);

      const labelPos = hourToXY(h, 126);
      addText(
        baseLayer,
        labelPos.x,
        labelPos.y,
        String(h),
        isMajor ? "9.5" : "7",
        isMajor ? "#E0F2FE" : "#64748B",
        isMajor ? "700" : "500"
      );
    }

    // 5. Graduation intérieure : Heures australiennes (0 à 23 alignées sur le cadran orange)
    for (let herH = 0; herH < 24; herH++) {
      const localAngleHour = (((herH - offset) % 24) + 24) % 24;
      const isMajor = herH % 3 === 0;
      const labelPos = hourToXY(localAngleHour, 56);
      addText(
        baseLayer,
        labelPos.x,
        labelPos.y,
        String(herH),
        isMajor ? "8" : "6",
        isMajor ? "#FDBA74" : "#9A3412",
        isMajor ? "700" : "400"
      );
    }

    // 6. Disque central : Heure exacte en Australie
    const centerBg = document.createElementNS(svgNS, "circle");
    centerBg.setAttribute("cx", 0);
    centerBg.setAttribute("cy", 0);
    centerBg.setAttribute("r", "26");
    centerBg.setAttribute("fill", "#0F172A");
    centerBg.setAttribute("stroke", "rgba(251, 146, 60, 0.35)");
    centerBg.setAttribute("stroke-width", "1.2");
    centerLayer.appendChild(centerBg);

    const herTimeStr = now.toLocaleTimeString("fr-FR", {
      timeZone: HER_TZ, hour: "2-digit", minute: "2-digit"
    });
    addText(centerLayer, 0, 0, herTimeStr, "13", "#FDBA74", "700");

    // 7. Aiguille rouge en temps réel (pointe sur l'heure actuelle)
    const nowFloat = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
    const base = hourToXY(nowFloat, 27);
    const tip = hourToXY(nowFloat, 113);

    const line = document.createElementNS(svgNS, "line");
    line.setAttribute("x1", base.x);
    line.setAttribute("y1", base.y);
    line.setAttribute("x2", tip.x);
    line.setAttribute("y2", tip.y);
    line.setAttribute("stroke", "#F43F5E");
    line.setAttribute("stroke-width", "2.4");
    line.setAttribute("stroke-linecap", "round");
    needleLayer.appendChild(line);

    const cap = document.createElementNS(svgNS, "circle");
    cap.setAttribute("cx", tip.x);
    cap.setAttribute("cy", tip.y);
    cap.setAttribute("r", "2.8");
    cap.setAttribute("fill", "#F43F5E");
    needleLayer.appendChild(cap);
  }

  render();
  setInterval(render, 15000);
</script>
</body>
</html>
