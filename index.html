<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #0F172A;
    color: #F8FAFC;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: min(92vw, 380px);
    background: #1E293B;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 18px 16px 20px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.45);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .badge {
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    letter-spacing: 0.2px;
  }
  .badge.ok {
    background: rgba(16, 185, 129, 0.18);
    color: #34D399;
    border: 1px solid rgba(52, 211, 153, 0.35);
  }
  .badge.no {
    background: rgba(148, 163, 184, 0.15);
    color: #CBD5E1;
    border: 1px solid rgba(148, 163, 184, 0.25);
  }
  svg#clock {
    width: 100%;
    max-width: 300px;
    height: auto;
    aspect-ratio: 1 / 1;
    display: block;
  }
  .legend {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    font-size: 12px;
  }
  .leg-item {
    background: rgba(15, 23, 42, 0.55);
    border-radius: 12px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .leg-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    color: #E2E8F0;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .leg-sub {
    color: #94A3B8;
    font-size: 11px;
    padding-left: 15px;
  }
  .status-line {
    font-size: 12px;
    color: #94A3B8;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <div id="status-badge" class="badge no">Chargement...</div>

    <svg id="clock" viewBox="-130 -130 260 260">
      <g id="layer-base"></g>
      <g id="layer-center"></g>
      <g id="layer-needle"></g>
    </svg>

    <div class="legend">
      <div class="leg-item">
        <div class="leg-title"><span class="dot" style="background:#38BDF8;"></span>Moi</div>
        <div class="leg-sub" id="my-info">9h – 23h</div>
      </div>
      <div class="leg-item">
        <div class="leg-title"><span class="dot" style="background:#FB923C;"></span>Elle</div>
        <div class="leg-sub" id="her-info">7h – 22h</div>
      </div>
    </div>

    <div class="status-line" id="extra-info"></div>
  </div>

<script>
  // --- PARAMÈTRES ---
  const MY_START = 9;
  const MY_END = 23;
  const HER_START = 7;
  const HER_END = 22;
  const HER_TZ = "Australia/Sydney";
  const HER_LABEL = "Australie";
  // ------------------

  const svgNS = "http://www.w3.org/2000/svg";
  const baseLayer = document.getElementById("layer-base");
  const centerLayer = document.getElementById("layer-center");
  const needleLayer = document.getElementById("layer-needle");

  function hourToXY(hour, radius) {
    const angleDeg = (hour / 24) * 360 - 90;
    const rad = (angleDeg * Math.PI) / 180;
    return { x: radius * Math.cos(rad), y: radius * Math.sin(rad) };
  }

  function createArc(startHour, endHour, radius, strokeWidth, color, opacity = 1, round = false) {
    let span = endHour - startHour;
    if (span <= 0) span += 24;
    if (span >= 24) span = 23.999;

    const p1 = hourToXY(startHour, radius);
    const p2 = hourToXY(startHour + span, radius);
    const largeArc = span > 12 ? 1 : 0;

    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", `M ${p1.x} ${p1.y} A ${radius} ${radius} 0 ${largeArc} 1 ${p2.x} ${p2.y}`);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", color);
    path.setAttribute("stroke-width", strokeWidth);
    path.setAttribute("stroke-opacity", opacity);
    path.setAttribute("stroke-linecap", round ? "round" : "butt");
    return path;
  }

  function addText(parent, x, y, text, size, color, weight = "400") {
    const t = document.createElementNS(svgNS, "text");
    t.setAttribute("x", x);
    t.setAttribute("y", y);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("dominant-baseline", "central");
    t.setAttribute("font-size", size);
    t.setAttribute("font-weight", weight);
    t.setAttribute("fill", color);
    t.textContent = text;
    parent.appendChild(t);
    return t;
  }

  function getOffsetHours(now, timeZone) {
    const fmt = new Intl.DateTimeFormat("en-GB", {
      timeZone,
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit",
      hour12: false
    });
    const p = Object.fromEntries(
      fmt.formatToParts(now).filter(x => x.type !== "literal").map(x => [x.type, x.value])
    );
    const herUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
    const locUtc = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
    return (herUtc - locUtc) / 3600000;
  }

  function isHourInRange(h, start, end) {
    h = ((h % 24) + 24) % 24;
    start = ((start % 24) + 24) % 24;
    end = ((end % 24) + 24) % 24;
    if (start < end) return h >= start && h < end;
    return h >= start || h < end; // chevauche minuit
  }

  function formatHourLabel(h) {
    const norm = Math.round((((h % 24) + 24) % 24) * 10) / 10;
    const hh = Math.floor(norm);
    const mm = Math.round((norm - hh) * 60);
    return mm === 0 ? `${hh}h` : `${hh}h${String(mm).padStart(2, "0")}`;
  }

  function render() {
    baseLayer.innerHTML = "";
    centerLayer.innerHTML = "";
    needleLayer.innerHTML = "";

    const now = new Date();
    const offset = getOffsetHours(now, HER_TZ);

    // Anneau extérieur : Toi (9h-23h)
    baseLayer.appendChild(createArc(0, 24, 96, 14, "rgba(56, 189, 248, 0.16)", 1, false));
    baseLayer.appendChild(createArc(MY_START, MY_END, 96, 14, "#38BDF8", 0.95, true));

    // Anneau intérieur : Elle (7h-22h ramené à ton heure)
    const herStartLoc = (((HER_START - offset) % 24) + 24) % 24;
    const herEndLoc = (((HER_END - offset) % 24) + 24) % 24;
    baseLayer.appendChild(createArc(0, 24, 76, 14, "rgba(251, 146, 60, 0.16)", 1, false));
    baseLayer.appendChild(createArc(herStartLoc, herEndLoc, 76, 14, "#FB923C", 0.95, true));

    // Anneau fin vert sur les minutes où vous êtes dispo en même temps
    const step = 0.25; // pas de 15 min
    for (let t = 0; t < 24; t += step) {
      if (isHourInRange(t, MY_START, MY_END) && isHourInRange(t, herStartLoc, herEndLoc)) {
        baseLayer.appendChild(createArc(t, t + step, 86, 4, "#34D399", 0.9, false));
      }
    }

    // Repères 0h, 6h, 12h, 18h
    [0, 6, 12, 18].forEach(h => {
      const pos = hourToXY(h, 115);
      addText(baseLayer, pos.x, pos.y, `${h}h`, "9", "#94A3B8", "600");
    });

    // Texte central : heure chez elle
    const herTimeStr = now.toLocaleTimeString("fr-FR", {
      timeZone: HER_TZ, hour: "2-digit", minute: "2-digit"
    });
    addText(centerLayer, 0, -9, herTimeStr, "17", "#F8FAFC", "700");
    addText(centerLayer, 0, 9, HER_LABEL, "8.5", "#94A3B8", "500");

    // Aiguille rouge en temps réel
    const nowFloat = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
    const tip = hourToXY(nowFloat, 106);

    const line = document.createElementNS(svgNS, "line");
    line.setAttribute("x1", 0);
    line.setAttribute("y1", 0);
    line.setAttribute("x2", tip.x);
    line.setAttribute("y2", tip.y);
    line.setAttribute("stroke", "#F43F5E");
    line.setAttribute("stroke-width", "2.5");
    line.setAttribute("stroke-linecap", "round");
    needleLayer.appendChild(line);

    const cap = document.createElementNS(svgNS, "circle");
    cap.setAttribute("cx", tip.x);
    cap.setAttribute("cy", tip.y);
    cap.setAttribute("r", "3");
    cap.setAttribute("fill", "#F43F5E");
    needleLayer.appendChild(cap);

    // Badge dispo en direct
    const bothNow = isHourInRange(nowFloat, MY_START, MY_END) && isHourInRange(nowFloat, herStartLoc, herEndLoc);
    const badge = document.getElementById("status-badge");
    if (bothNow) {
      badge.textContent = "Dispo ensemble maintenant";
      badge.className = "badge ok";
    } else {
      badge.textContent = "Pas dispo ensemble là";
      badge.className = "badge no";
    }

    // Infos légende & décalage
    document.getElementById("my-info").textContent = `${MY_START}h–${MY_END}h (toi)`;
    document.getElementById("her-info").textContent =
      `${HER_START}h–${HER_END}h (${formatHourLabel(herStartLoc)}–${formatHourLabel(herEndLoc)} ici)`;

    const sign = offset >= 0 ? "+" : "";
    const roundedOffset = Math.round(offset * 10) / 10;
    document.getElementById("extra-info").textContent =
      `Décalage : ${sign}${roundedOffset}h · Vert = créneaux communs`;
  }

  render();
  setInterval(render, 15000);
</script>
</body>
</html>
